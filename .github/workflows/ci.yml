name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: self-hosted

        container:
            image: epitechcontent/epitest-docker:latest

        steps:
            - uses: actions/checkout@v7

            - name: make
              run: make

            - name: make codingstyle
              run: make codingstyle
    mirror:
        needs: [build]

        runs-on: self-hosted

        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - uses: pixta-dev/repository-mirroring-action@v1
              with:
                target_repo_url:
                    ${{ VARS.MY_SUDO_EPITECH_REPO }}
                ssh_private_key:
                    ${{ secrets.SSH_MIRROR_PRIVATE_KEY }}